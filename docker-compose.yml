services:
  spark-master:
    image: smarttech-spark:latest
    container_name: spark-master
    hostname: spark-master
    env_file:
      - .env
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
        --host spark-master
        --port 7077
        --webui-port 8080
    ports:
      - "8080:8080"  # Spark UI
      - "7077:7077"  # Spark Master
    volumes:
      - ./data:/opt/spark/data
      - ./checkpoints:/opt/spark/checkpoints
      - ./notebooks:/opt/spark/notebooks
      - ./scripts:/opt/spark/scripts
      - ./delta:/opt/spark/delta
    networks:
      - spark-network

  spark-worker:
    image: smarttech-spark:latest
    container_name: spark-worker
    hostname: spark-worker
    depends_on:
      - spark-master
    env_file:
      - .env
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
        spark://spark-master:7077
        --webui-port 8081
    ports:
      - "8081:8081"  # Worker UI
    volumes:
      - ./data:/opt/spark/data
      - ./checkpoints:/opt/spark/checkpoints
      - ./notebooks:/opt/spark/notebooks
      - ./scripts:/opt/spark/scripts
      - ./delta:/opt/spark/delta
    networks:
      - spark-network

  jupyter:
    image: smarttech-spark:latest
    container_name: spark-jupyter
    hostname: spark-jupyter
    depends_on:
      - spark-master
    env_file:
      - .env
    command: >
      jupyter notebook
        --ip=0.0.0.0
        --port=8888
        --no-browser
        --allow-root
        --notebook-dir=/opt/spark/notebooks
        --NotebookApp.token=''
        --NotebookApp.password=''
    ports:
      - "8888:8888"  # Jupyter Notebook
    volumes:
      - ./data:/opt/spark/data
      - ./checkpoints:/opt/spark/checkpoints
      - ./notebooks:/opt/spark/notebooks
      - ./scripts:/opt/spark/scripts
      - ./delta:/opt/spark/delta
    environment:
      - SPARK_MASTER=spark://spark-master:7077
    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge
